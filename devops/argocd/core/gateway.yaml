apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: lmthing

---
# Allows the gateway to create/delete user-* namespaces, deployments, and services
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lmthing-compute-manager
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services", "configmaps"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lmthing-compute-manager
subjects:
  - kind: ServiceAccount
    name: gateway
    namespace: lmthing
roleRef:
  kind: ClusterRole
  name: lmthing-compute-manager
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: lmthing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: gateway
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: gateway
          image: lmthingacr.azurecr.io/gateway:ff6b376
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: LITELLM_MASTER_KEY
            - name: LITELLM_URL
              value: "http://litellm:4000"
            - name: BASE_URL
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: BASE_URL
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_PRICE_BASIC
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: STRIPE_PRICE_BASIC
            - name: STRIPE_PRICE_PRO
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: STRIPE_PRICE_PRO
            - name: STRIPE_PRICE_MAX
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: STRIPE_PRICE_MAX
            - name: ZITADEL_URL
              value: "https://auth.lmthing.cloud"
            - name: ZITADEL_GITHUB_IDP_ID
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: ZITADEL_GITHUB_IDP_ID
            - name: ZITADEL_ISSUER
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: ZITADEL_ISSUER
            - name: ZITADEL_SERVICE_PAT
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: ZITADEL_SERVICE_PAT
            - name: ZITADEL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: ZITADEL_CLIENT_ID
            - name: ZITADEL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: ZITADEL_CLIENT_SECRET
            - name: GATEWAY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: GATEWAY_JWT_SECRET
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_SLUG
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: GITHUB_APP_SLUG
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: GITHUB_APP_PRIVATE_KEY
            - name: GITHUB_ISSUES_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: GITHUB_ISSUES_TOKEN
            # Render-service token — the gateway injects this into each pod's user-env as
            # RENDER_SERVICE_TOKEN so the webSearch google provider can authenticate to the
            # in-cluster render service. Optional so a blank/absent key never crashes the pod.
            - name: RENDER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: RENDER_SERVICE_TOKEN
                  optional: true
            # OAuth integrations (Connections) — optional so a blank/absent key
            # never crashes the pod; a provider without creds reports configured:false.
            - name: CONNECTIONS_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: CONNECTIONS_ENC_KEY
                  optional: true
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: GOOGLE_OAUTH_CLIENT_ID
                  optional: true
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: GOOGLE_OAUTH_CLIENT_SECRET
                  optional: true
            - name: SLACK_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: SLACK_OAUTH_CLIENT_ID
                  optional: true
            - name: SLACK_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: SLACK_OAUTH_CLIENT_SECRET
                  optional: true
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: GITHUB_OAUTH_CLIENT_ID
                  optional: true
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: GITHUB_OAUTH_CLIENT_SECRET
                  optional: true
            # Passwordless email sign-in. All optional: with none of them set the
            # mailer resolves to its `console` transport, reports configured:false,
            # and POST /api/auth/email/start answers 503 instead of pretending it
            # sent a code. Setting RESEND_API_KEY *or* SMTP_HOST is the only step
            # needed to turn email sign-in on.
            - name: EMAIL_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: EMAIL_PROVIDER
                  optional: true
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: EMAIL_FROM
                  optional: true
            - name: EMAIL_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: EMAIL_FROM_NAME
                  optional: true
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: RESEND_API_KEY
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: SMTP_PASSWORD
                  optional: true
            - name: SMTP_SECURITY
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: SMTP_SECURITY
                  optional: true
            # Overrides the magic-link redirect allowlist (comma-separated exact
            # origins). Unset ⇒ https on any lmthing.* host, plus local dev hosts.
            - name: EMAIL_LOGIN_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: EMAIL_LOGIN_ALLOWED_ORIGINS
                  optional: true
            # One address whose sign-in code is fixed rather than mailed, so an app
            # store reviewer can get past a login whose only factor is a code sent to
            # a mailbox they do not have. Inert unless BOTH are set — clearing either
            # revokes it — and it is a bypass for that one account only, so keep
            # nothing but demo content behind it. See org/docs/cloud/auth.md.
            - name: REVIEW_DEMO_EMAIL
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: REVIEW_DEMO_EMAIL
                  optional: true
            - name: REVIEW_DEMO_CODE
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: REVIEW_DEMO_CODE
                  optional: true
            # Where a team invite email sends the recipient: the teams list, which
            # is what shows a pending invite with its Accept button. Not a secret —
            # only overridden to point a test deploy at a different front end.
            - name: TEAM_APP_URL
              value: "https://lmthing.team/team"
            - name: GITHUB_ISSUES_REPO
              value: "lmthing/bug-reports"
            - name: GITHUB_BUGREPORT_REPO
              value: "lmthing/bug-reports"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: DATABASE_URL
            - name: ACR_REGISTRY
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: ACR_REGISTRY
            - name: ACR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: ACR_USERNAME
            - name: ACR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lmthing-secrets
                  key: ACR_PASSWORD
            - name: COMPUTE_IMAGE_TAG
              value: "e5a4c24"
            # Phase 4 fast cold-start: when set (bare "sha256:...", no
            # "compute@" prefix), the gateway builds
            # ${ACR_REGISTRY}/compute@${COMPUTE_IMAGE_DIGEST} with
            # imagePullPolicy: IfNotPresent instead of compute:latest +
            # Always (see cloud/gateway/src/lib/compute.ts). Empty today —
            # CI (.github/workflows/build-images.yml) fills this in on the
            # next successful compute image build, in lockstep with
            # COMPUTE_IMAGE_TAG and the compute-prepull DaemonSet image.
            - name: COMPUTE_IMAGE_DIGEST
              value: "sha256:ccba8179acc6e329f4250956c1fc1c742a0e77c8b7aa135ebee20a663e850ea1"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: lmthing
spec:
  selector:
    app: gateway
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
