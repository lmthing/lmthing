server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Envoy forwards the full /auth/... path unrewritten (chat-routes.yaml's chat-auth-static route
    # has no URLRewrite filter), but the built files live at the container's root (dist/assets/...,
    # not dist/auth/assets/...) — vite's `base: '/auth/'` only changes the URLs baked into the HTML/JS,
    # not where the build output is written. Strip the prefix here so $uri resolves to a real file;
    # `break` keeps nginx from re-running location matching against the rewritten URI.
    location /auth/ {
        rewrite ^/auth/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location /auth/assets/ {
        rewrite ^/auth/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the shell, or a returning browser keeps a stale index.html referencing
    # since-replaced /assets/ hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
}
