name: Publish OTA update

# Ships a JavaScript-only update to installed copies of the mobile app, through our own
# expo-open-ota server (https://lmthing.cloud/ota). No store review, no new binary.
#
# THE THING TO UNDERSTAND BEFORE USING THIS: an OTA can only replace JavaScript. The
# `runtimeVersion` policy is `fingerprint` (sdk/org/apps/mobile/app.config.js), so a
# change that touches the native project — a new Expo module, an SDK bump, a permission
# — produces a DIFFERENT fingerprint, and the update is simply never offered to the
# binaries already out there. That is the safe failure, and it is why the policy is
# fingerprint rather than appVersion: nothing here can push a bundle at a binary that
# cannot run it.
#
# It runs AUTOMATICALLY on a push to main that moves the app's JavaScript, and manually
# for anything else (a percentage rollout, a staging publish, a re-run).
#
# It did not always. The guard used to be a person: someone decided to publish, at a
# rollout they chose, behind a required reviewer on the `production` environment. Making
# it automatic removes that person, so it has to put something in their place rather than
# simply delete them — a bad bundle still reaches every phone in minutes, and nothing
# reviews it on the way. What stands there now:
#
#   · the real gates run FIRST, and a red one stops the publish — typecheck, a production
#     bundle, the @lmthing/ui suite, and the Metro native harness, which is the only thing
#     that can see a broken React Native graph
#   · it refuses to publish for a runtimeVersion no shipped binary has
#     (apps/mobile/shipped-runtime-versions.json), so a native change on main is a no-op
#     with an explanation instead of an update nobody can receive
#   · afterwards it asks the server what a phone would get and FAILS if that is not a
#     real, signed, downloadable update
#   · rollback stays instant and manual, which is the actual answer to a bad bundle
#
# The automatic path does NOT use the `production` environment: a required reviewer there
# would just park every push waiting for a click, which is not automation. Manual
# dispatch keeps it.

on:
  push:
    branches: [main]
    paths:
      # `sdk/org` is the bare SUBMODULE POINTER, and it is the only entry here that can
      # fire: the app and every lib it bundles live INSIDE the submodule, which no commit
      # in this repository ever touches — a submodule update changes exactly one gitlink
      # entry, at `sdk/org`. Naming paths inside it would match nothing, which is the bug
      # native-target.yml documents having shipped with.
      #
      # It also means the POINTER is the release signal, and that is the right one: JS
      # that main does not point at is not what the rest of the product is running, so it
      # has no business reaching phones ahead of it.
      - 'sdk/org'
      - '.github/workflows/ota-publish.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Update branch to publish to'
        required: true
        type: choice
        options: [production, staging]
        default: staging
      rollout:
        description: 'Percent of devices to offer it to, 1-99 (start small; raise by re-running). Leave EMPTY for 100%.'
        required: false
        default: '10'
      message:
        description: 'What this update changes (shown in the eoas dashboard)'
        required: true
      verify_runtime_version:
        description: >-
          Optional but STRONGLY recommended: the runtimeVersion of the build that is
          actually installed on phones (`eas build:list --json` → .runtimeVersion).
          Without it the check only proves CI can reach its own bundle.
        required: false

concurrency:
  # Two publishes racing to the same branch leave the newest manifest ambiguous.
  group: ota-${{ github.event.inputs.branch || 'production' }}
  # On a push, only the newest commit is worth shipping — a queued run for a commit that
  # has already been superseded would publish an update that is obsolete on arrival. A
  # manual run is never cancelled: someone chose its rollout and its message.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # `staging` and `production` are GitHub Environments, and `production` carries a
    # required reviewer. That gate is right for a manual publish and fatal to an automatic
    # one — it would park every push until someone clicked. `ota-auto` is a separate,
    # unprotected environment so the automatic path still shows up in the deployment
    # history without waiting on an approval it is designed not to need.
    environment: ${{ github.event_name == 'push' && 'ota-auto' || github.event.inputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The fingerprint is computed from the native project, which is derived from
          # the whole workspace. A shallow checkout hashes a different tree.
          fetch-depth: 0

      # One place the two triggers become the same thing, so the publish steps below never
      # branch on the event again. A push ships the whole update at once: a partial
      # rollout has to be promoted by hand, so scheduling one automatically would leave
      # most devices on the old bundle until somebody remembered.
      # The inputs arrive as env vars, never interpolated into the script body: on the
      # manual path the message is free text a human typed, and a single quote in it would
      # otherwise end the shell string it was pasted into.
      - name: Resolve what this run is publishing
        id: params
        env:
          IN_BRANCH: ${{ github.event.inputs.branch }}
          IN_ROLLOUT: ${{ github.event.inputs.rollout }}
          IN_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH=production
            ROLLOUT=
            # %s is a single line by construction, so it cannot break the key=value form
            # $GITHUB_OUTPUT expects.
            MESSAGE="$(git log -1 --pretty=%s) (auto, ${GITHUB_SHA::8})"
          else
            BRANCH="$IN_BRANCH"
            ROLLOUT="$IN_ROLLOUT"
            MESSAGE="$(printf '%s' "$IN_MESSAGE" | tr '\n' ' ')"
          fi
          {
            echo "branch=$BRANCH"
            echo "rollout=$ROLLOUT"
            echo "message=$MESSAGE"
          } >> "$GITHUB_OUTPUT"
          echo "publishing to '$BRANCH' as: $MESSAGE"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4

      - name: Install
        working-directory: sdk/org
        run: pnpm install --frozen-lockfile

      # @lmthing/core exports from dist/, which is gitignored — the same clean-clone gap
      # that broke the first EAS build. Metro cannot bundle without it.
      - name: Build the app's workspace dependencies
        working-directory: sdk/org/apps/mobile
        run: pnpm run eas-build-post-install

      # Would this update reach anybody? An OTA replaces JavaScript only, so a commit that
      # moved the native project produces a runtimeVersion no installed binary asks for —
      # and publishing under it succeeds, silently, forever. Decided before the gates so a
      # native-only change does not spend five minutes proving a bundle nobody will get.
      - name: Decide whether an OTA can carry this commit
        id: target
        working-directory: sdk/org/apps/mobile
        env:
          RELEASE_CHANNEL: ${{ steps.params.outputs.branch }}
          EXPO_OTA_APP_ID: 9a2ba224-69e6-4629-a894-4f42eb305a45
        run: node scripts/resolve-publish-target.mjs

      # THE gates. On a manual run someone chose to publish and can read a red check for
      # themselves; on a push nothing else stands between a bad bundle and every phone, so
      # these are the replacement for the reviewer this workflow used to require.
      #
      # The native harness earns its place here specifically: a broken React Native graph
      # is invisible to tsc and to the jsdom suite (`isWeb` is always true there), and
      # `bundle:android` proves the app bundles, not that its screens still mount.
      - name: Gates
        if: steps.target.outputs.publish == 'true'
        working-directory: sdk/org/apps/mobile
        run: pnpm typecheck && pnpm bundle:android

      - name: Gates — shared UI, web and native
        if: steps.target.outputs.publish == 'true'
        working-directory: sdk/org
        run: |
          pnpm --filter @lmthing/ui test
          pnpm --filter @lmthing/ui test:native

      - name: Publish
        if: steps.target.outputs.publish == 'true'
        working-directory: sdk/org/apps/mobile
        env:
          # An APP-SCOPED API key from the eoas dashboard (`eoo_…`), not the server's
          # JWT_SECRET — control-plane mode authenticates the CLI per app, so this
          # credential can only publish to `lmthing` and can be revoked on its own.
          EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
          # eoas reads RELEASE_CHANNEL to decide which channel's config builds INTO the
          # bundle. It does not select where the update lands — only --branch does. Kept
          # equal to the branch so the two cannot drift.
          RELEASE_CHANNEL: ${{ steps.params.outputs.branch }}
          # And app.config.js reads the same variable for the `expo-channel-name` header
          # it compiles into a build, so a bundle and the binary that asks for it agree.
          EXPO_OTA_APP_ID: 9a2ba224-69e6-4629-a894-4f42eb305a45
          BRANCH: ${{ steps.params.outputs.branch }}
          ROLLOUT: ${{ steps.params.outputs.rollout }}
          MESSAGE: ${{ steps.params.outputs.message }}
        # `--rollout-percentage` takes 1-99; the CLI REJECTS 100 ("Expected an integer
        # less than or equal to 99"), because a full rollout is the absence of a
        # rollout, not a rollout of everyone. So an empty input drops the flag rather
        # than passing a number eoas will refuse.
        #
        # The values arrive as env vars rather than `${{ }}` interpolated into the script:
        # a commit subject becomes the message on the automatic path, and a subject
        # containing a quote or a backtick would otherwise be pasted straight into a shell.
        run: |
          args=(--branch "$BRANCH" --message "$MESSAGE" --nonInteractive)
          if [ -n "$ROLLOUT" ]; then
            args+=(--rollout-percentage "$ROLLOUT")
          fi
          npx eoas publish "${args[@]}"

      # eoas prints "successfully pushed" whether or not any device can ever receive the
      # update, and the two ways it reaches nobody are both invisible from here: the
      # channel may have no branch mapping (every device gets 404 while the branch fills
      # with updates), or the runtimeVersion may be one no binary has. So ask the server
      # the question a phone asks, and fail the run if the answer is not an update.
      #
      # A rollout deliberately does NOT skip this. A partial rollout still has to be
      # servable — the percentage decides who is offered it, not whether it exists — and
      # the server answers this request from the same branch either way.
      #
      # `verify_runtime_version` is what makes this a real check rather than a
      # self-consistency one. Left empty, the script resolves the runtimeVersion from
      # THIS checkout — the same tree the publish used — so it can only confirm CI can
      # reach its own bundle, and stays green while every shipped phone gets nothing.
      # On the automatic path it is never empty: the previous step already resolved the
      # runtimeVersion and proved a shipped binary has it.
      - name: Verify a device would actually receive it
        if: steps.target.outputs.publish == 'true'
        working-directory: sdk/org/apps/mobile
        env:
          RELEASE_CHANNEL: ${{ steps.params.outputs.branch }}
          EXPO_OTA_APP_ID: 9a2ba224-69e6-4629-a894-4f42eb305a45
          RUNTIME_VERSION: ${{ github.event.inputs.verify_runtime_version || steps.target.outputs.runtimeVersion }}
        run: |
          if [ -z "$RUNTIME_VERSION" ]; then
            echo "::warning title=Weak OTA verification::No verify_runtime_version given," \
                 "so this only proves CI can reach the bundle it just published — not that" \
                 "any INSTALLED build can. Pass the shipped build's runtimeVersion next time."
          fi
          node scripts/verify-update-served.mjs

      # Runs even when nothing was published, because "no update went out and here is why"
      # is the answer someone will be looking for after a push that changed native code.
      - name: Summary
        if: always()
        env:
          PUBLISHED: ${{ steps.target.outputs.publish }}
          REASON: ${{ steps.target.outputs.reason }}
          RTV: ${{ steps.target.outputs.runtimeVersion }}
          BRANCH: ${{ steps.params.outputs.branch }}
          ROLLOUT: ${{ steps.params.outputs.rollout }}
        run: |
          {
          if [ "$PUBLISHED" != "true" ]; then
            echo "### OTA skipped — no update was published"
            echo ""
            echo "- **runtimeVersion** \`$RTV\`"
            echo "- **why** $REASON"
            echo ""
            echo "This is the safe outcome, not a failure: an update published under a"
            echo "runtimeVersion no binary has would succeed and reach nobody."
            exit 0
          fi
            echo "### OTA published"
            echo ""
            echo "- **branch** \`$BRANCH\`"
            echo "- **rollout** ${ROLLOUT:-100}%"
            echo "- **runtimeVersion** \`$RTV\`"
            echo "- **commit** \`${{ github.sha }}\`"
            echo ""
            echo "Raise the rollout by re-running with a higher percentage."
            echo "To pull it back, roll back from the eoas dashboard — that is instant,"
            echo "and faster than publishing a fix."
          } >> "$GITHUB_STEP_SUMMARY"
