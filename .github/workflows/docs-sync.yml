name: Docs sync

# Hard gate for the SYNC contract (org/docs/SYNC.md): every citation in org/docs must
# resolve against the current code. A `path#Symbol` whose symbol is gone, or a
# `path:Lstart-Lend` out of bounds, fails the build — the doc has drifted from the code
# (or the code moved under the doc) and must be fixed in the same change.

on:
  pull_request:
    paths:
      - 'org/docs/**'
      # The bare SUBMODULE POINTER. `sdk/org/**` below cannot match: a submodule update
      # changes exactly one gitlink entry, at `sdk/org`, and never a path inside it. Every
      # citation in org/docs resolves INTO that code, so without this a pure sdk bump could
      # move or delete a cited symbol and this gate — the thing that makes "org/docs is the
      # source of truth" true — would not run. It only ever fired here because a doc edit
      # usually rode along in the same parent commit.
      - 'sdk/org'
      - 'sdk/org/**'
      - 'cloud/**'
      - 'store/**'
      - 'devops/**'
      - '.github/workflows/docs-sync.yml'
  push:
    branches: [main]
    paths:
      - 'org/docs/**'
      # The bare SUBMODULE POINTER. `sdk/org/**` below cannot match: a submodule update
      # changes exactly one gitlink entry, at `sdk/org`, and never a path inside it. Every
      # citation in org/docs resolves INTO that code, so without this a pure sdk bump could
      # move or delete a cited symbol and this gate — the thing that makes "org/docs is the
      # source of truth" true — would not run. It only ever fired here because a doc edit
      # usually rode along in the same parent commit.
      - 'sdk/org'
      - 'sdk/org/**'
      - 'cloud/**'
      - 'store/**'
      - 'devops/**'

jobs:
  check-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install resolver deps
        working-directory: org/docs/tools/docs-sync
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Check citations resolve
        run: node org/docs/tools/docs-sync/check.mjs
