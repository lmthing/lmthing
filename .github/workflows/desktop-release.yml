# Build the desktop app for Linux, macOS and Windows, and draft a release.
#
# This is the FIRST job in this repository that runs on anything but `ubuntu-latest`, and the first
# that produces a downloadable artifact. `desktop.yml` is the PR gate — typecheck, lint, tests,
# clippy, E2E, all on Linux. This one is the shipping path, and it is deliberately manual: it is
# triggered by a tag or by hand, never by a push to main.
#
# ## What is and is not signed
#
# Nothing, yet. The macOS `.app`/`.dmg` and the Windows `.exe` are produced UNSIGNED unless the
# secrets below are present, and an unsigned build is not something to hand a non-technical person:
# macOS reports "damaged and can't be opened" (Gatekeeper's message for a missing signature, which
# reads as a corrupt download), and Windows SmartScreen blocks the first run behind a "more info"
# link most people never click.
#
# The workflow is written so adding the secrets is the ONLY change needed — every signing input is
# read from a secret that is simply absent today, and `tauri-action` skips the step when it is:
#
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD   a Developer ID Application cert, base64'd
#   APPLE_SIGNING_IDENTITY                           e.g. "Developer ID Application: … (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID        notarisation (an app-specific password)
#   WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD   Authenticode, or Azure Trusted Signing
#
# ## The updater key is a different key, and the dangerous one
#
# `TAURI_SIGNING_PRIVATE_KEY` is minisign, not code signing, and it authorises arbitrary code
# execution on every machine that has ever installed this app. It is the highest-value secret the
# org will hold. It is NOT referenced here yet, because an updater that nobody can rotate is worse
# than no updater: the rotation plan is written before the first release that uses one.
name: Desktop release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build every platform but do not create a release'
        type: boolean
        default: true
  push:
    tags: ['desktop-v*']

# A named environment so the signing secrets can be gated behind a required reviewer, the same way
# `ota-publish.yml` gates the mobile channel.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    environment: desktop-release
    permissions:
      contents: write
    strategy:
      # Do NOT cancel the other platforms when one fails. A macOS-only toolchain problem should
      # still leave a reviewable Linux and Windows build rather than three empty results.
      fail-fast: false
      matrix:
        include:
          # Apple silicon and Intel are separate builds, not a universal binary: a universal `.app`
          # doubles the download for everyone to save one CI job.
          - platform: macos-14
            target: aarch64-apple-darwin
            label: macOS (Apple silicon)
          - platform: macos-13
            target: x86_64-apple-darwin
            label: macOS (Intel)
          # The OLDEST supported Ubuntu, deliberately. AppImage and .deb are forward-compatible
          # only: something linked against a newer glibc will not start on an older distro, and the
          # failure is a bare "version `GLIBC_2.39' not found" at exec time.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux (x86_64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x86_64)

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Tauri links against WebKitGTK on Linux. Without these the build fails at LINK time with an
      # error that reads like a Rust problem and is not one.
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev libgtk-3-dev build-essential curl wget file

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/org/apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install
        working-directory: sdk/org
        run: pnpm install --frozen-lockfile

      # `@lmthing/core`'s `ui` export points at a gitignored `dist/`, so the app cannot typecheck or
      # bundle until core is built.
      - name: Build @lmthing/core
        working-directory: sdk/org
        run: pnpm --filter @lmthing/core build

      # The committed colour file must still match tokens.json. `include_str!` would happily compile
      # a stale one, and the window would be the wrong colour on every launch with nothing to say so.
      - name: Generate the token file
        working-directory: sdk/org/apps/desktop
        run: pnpm generate:tauri-conf

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Absent today. Each is read only if set; `tauri-action` skips signing when it is not.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: sdk/org/apps/desktop
          args: --target ${{ matrix.target }}
          # A DRAFT, always. A release that publishes itself is a release nobody looked at, and
          # these are unsigned — somebody has to decide that is acceptable before anyone downloads
          # one.
          releaseDraft: true
          prerelease: true
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-dev-{0}', github.run_number) }}
          releaseName: 'LMThing desktop ${{ github.ref_type == ''tag'' && github.ref_name || github.run_number }}'
          releaseBody: |
            Unsigned builds. macOS will report the app as damaged and Windows SmartScreen will block
            the first run until code signing is in place — see `.github/workflows/desktop-release.yml`.
          # `workflow_dispatch` defaults to a dry run: build all four, publish nothing.
          includeRelease: ${{ github.ref_type == 'tag' || inputs.dry_run == false }}

      # Uploaded regardless of whether a release was created, so a dry run is still inspectable.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.target }}
          path: |
            sdk/org/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 14
