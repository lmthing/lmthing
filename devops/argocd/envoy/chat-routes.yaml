# lmthing.chat — the dsh-served harness (Part B cutover, see dsh/PROGRESS.md). Unlike the retired
# unified-SPA pattern (a JWT-free static shell + a separately-authenticated /api proxy), dsh serves
# UI *and* API from ONE per-user pod, so the document route itself needs a valid JWT before Envoy
# will even reach it. Modeled directly on lmthing.app's app-routes.yaml/app-policies.yaml (an
# already-live pattern solving the identical problem for project-app pages): the JWT is `optional`
# so a token-less request still reaches the shared Lua, which redirects a DOCUMENT navigation with
# no `x-user-id` to `/auth/` (the new chat-auth shell — JWT-free, runs the existing cross-domain SSO
# bridge, then hands off back to `/` with a cookie set) and 401s everything else. See
# devops/argocd/envoy/chat-policies.yaml for the JWT/Lua config.

# HTTP -> HTTPS redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat-http-redirect
  namespace: gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lmthing-gw
      sectionName: chat-http
  hostnames:
    - lmthing.chat
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
# /auth/* -> the JWT-free login/handoff shell (chat-auth). Matched before the document catch-all
# below (more specific PathPrefix). No Lua, no dynamic per-user routing — this is a stock static
# Service, same as app/studio's own shells.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat-auth-static
  namespace: gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lmthing-gw
      sectionName: chat-https
  hostnames:
    - lmthing.chat
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - group: ""
          kind: Service
          name: chat-auth
          namespace: lmthing
          port: 80
          weight: 1

---
# /api/* -> Dynamic per-user backend (JWT-optional, Lua-routed — see chat-policies.yaml). The
# dsh UI's own fetches never set an Authorization header (dsh has no knowledge of gateway JWTs —
# see dsh/PROGRESS.md Part B2); they ride the `access_token` cookie the chat-auth shell set, same
# as every other same-origin request from this pod.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat-api-proxy
  namespace: gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lmthing-gw
      sectionName: chat-https
  hostnames:
    - lmthing.chat
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        # No path rewrite: the pod server serves routes UNDER /api (/api/health, dsh's own
        # /api/*), so the prefix must be kept.
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: rewrite-host-from-header
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: dynamic-user-backend
          weight: 1

---
# /* -> the document catch-all, straight to the user's dsh pod (JWT-optional + Lua, same policy as
# /api above — see chat-policies.yaml). Long cold-wake timeout, matching app-pages-bare: dsh's own
# first-boot profile bootstrap (pnpm install for a fresh PVC — see
# dsh/packages/pod-server/src/profile-bootstrap.js) can take longer than Envoy's 15s default.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat-document-proxy
  namespace: gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lmthing-gw
      sectionName: chat-https
  hostnames:
    - lmthing.chat
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: rewrite-host-from-header
      timeouts:
        request: "300s"
        backendRequest: "300s"
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: dynamic-user-backend
          weight: 1
